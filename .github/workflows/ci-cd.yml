name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. FRONTEND VERIFICATION & BUILD CHECKS
  # ==========================================
  frontend-verification:
    name: Verify Frontend (Typecheck, Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

  # ==========================================
  # 2. BACKEND VERIFICATION & CRITICAL TESTS
  # ==========================================
  backend-verification:
    name: Verify Backend (Dependencies, Syntax & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Smoke-Test Critical Production Imports
        working-directory: backend
        run: |
          python -c "import app.main; print('FastAPI app and production modules verified successfully.')"

      - name: Run Backend Unit & Rule Tests
        working-directory: backend
        run: |
          python -m pytest app/tests/test_rules.py app/tests/test_confidence.py app/tests/test_scoring.py -v

  # ==========================================
  # 3. GATED BACKEND DEPLOYMENT TO RENDER
  # ==========================================
  deploy-backend-render:
    name: Trigger Render Backend Deployment
    needs: [frontend-verification, backend-verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Dispatch Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render automated zero-downtime deployment..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Render response status code: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render deployment hook dispatch failed with status $HTTP_CODE"
            exit 1
          fi
          echo "Render deployment dispatched successfully."

      - name: Notice if Deploy Hook is Not Configured
        if: env.RENDER_DEPLOY_HOOK == ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
          echo "Render will auto-deploy via its native GitHub repository integration."

  # ==========================================
  # 4. GATED FRONTEND DEPLOYMENT CONFIRMATION
  # ==========================================
  deploy-frontend-vercel:
    name: Gated Vercel Deployment Confirmation
    needs: [frontend-verification, backend-verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Vercel Deploy Hook (Optional)
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel production deployment hook..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Vercel response status code: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Vercel deployment hook dispatch failed with status $HTTP_CODE"
            exit 1
          fi
          echo "Vercel deployment dispatched successfully."

      - name: Native Vercel Integration Notice
        if: env.VERCEL_DEPLOY_HOOK == ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "VERCEL_DEPLOY_HOOK_URL is not set. Vercel automatically deploys via its native GitHub App integration once commit checks succeed."

  # ==========================================
  # 5. POST-DEPLOYMENT HEALTH & CONNECTIVITY CHECK
  # ==========================================
  deployment-health-check:
    name: Post-Deployment Smoke & Health Verification
    needs: [deploy-backend-render, deploy-frontend-vercel]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP verification dependency
        run: pip install httpx

      - name: Run Deployment Health Verification
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ] && [ -z "$FRONTEND_URL" ]; then
            echo "BACKEND_URL and FRONTEND_URL GitHub secrets are not set yet. Skipping live endpoint poll."
            echo "Set BACKEND_URL and FRONTEND_URL in GitHub Secrets to enable automatic live endpoint health polling."
          else
            python scripts/verify_deployment.py --backend-url "$BACKEND_URL" --frontend-url "$FRONTEND_URL" --retries 10 --delay 15
          fi
